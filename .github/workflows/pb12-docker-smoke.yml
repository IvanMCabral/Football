name: PB1.2.2 Docker smoke

on:
  workflow_dispatch:
  push:
    paths:
      - Dockerfile
      - .dockerignore
      - pom.xml
      - src/**
      - tools/**
      - .github/workflows/pb12-docker-smoke.yml

permissions:
  contents: read

concurrency:
  group: pb12-docker-smoke
  cancel-in-progress: true

jobs:
  docker-smoke:
    name: Build and smoke backend image
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout audited revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Generate ephemeral job credentials
        shell: bash
        run: |
          set -euo pipefail
          db_password="$(openssl rand -hex 32)"
          redis_password="$(openssl rand -hex 32)"
          jwt_secret="$(openssl rand -base64 96 | tr -d '\n')"
          echo "::add-mask::$db_password"
          echo "::add-mask::$redis_password"
          echo "::add-mask::$jwt_secret"
          {
            echo "DB_PASSWORD=$db_password"
            echo "REDIS_PASSWORD=$redis_password"
            echo "REDIS_USERNAME=default"
            echo "JWT_SECRET=$jwt_secret"
            echo "DB_NAME=football_manager"
            echo "DB_USER=manager"
            echo "PB12_RUN_DIR=$RUNNER_TEMP/pb12-docker-smoke-$GITHUB_RUN_ID"
            echo "PB12_HOST_PORT=18080"
            echo "PB12_RESTART_PORT=18081"
          } >> "$GITHUB_ENV"

      - name: Verify artifact hygiene fails closed
        shell: bash
        run: bash tools/test-pb12-artifact-hygiene.sh

      - name: Verify artifact manifest fails closed
        shell: bash
        run: python tools/test-pb12-artifact-manifest.py

      - name: Run real Docker build and lifecycle smoke
        id: smoke
        shell: bash
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          set -euo pipefail
          set +e
          bash tools/run-pb12-docker-smoke.sh
          smoke_exit=$?
          set -e
          result="$PB12_RUN_DIR/pb12-docker-smoke-result.json"
          if [[ -s "$result" ]]; then
            smoke_failure_reason="$(jq -r '.failureReason // "unknown smoke failure"' "$result")"
            echo "PB12 smoke result:"
            jq '{status,failureReason,dockerAvailable,imageBuilt,healthcheckHealthy,liveness,readiness,registered,login,me,careerCreated,careerRecovered,secondStartup,javaPid1,gracefulShutdownObserved,redisDownReadiness,postgresDownReadiness,cleanupVerified}' "$result"
            if [[ "$smoke_exit" -ne 0 ]]; then
              echo "::error title=PB12 Docker smoke failure::$smoke_failure_reason"
            fi
          else
            echo "::error title=PB12 Docker smoke failure::result JSON missing"
          fi
          if [[ "$smoke_exit" -ne 0 ]]; then exit "$smoke_exit"; fi
          mkdir -p target
          cp "$result" target/pb12-docker-smoke-result.json

      - name: Generate image SBOM
        if: always()
        uses: anchore/sbom-action@d94f46e13c6c62f59525ac9a1e147a99dc0b9bf5 # v0.17.0
        with:
          image: manager-backend:pb12
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/pb12-docker-smoke-${{ github.run_id }}/pb12-image-sbom.cdx.json
          upload-artifact: false

      - name: Scan image for vulnerabilities
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: manager-backend:pb12
          format: json
          output: ${{ runner.temp }}/pb12-docker-smoke-${{ github.run_id }}/pb12-trivy.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          vuln-type: os,library
          scanners: vuln

      - name: Finalize scan gate and result JSON
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result="$PB12_RUN_DIR/pb12-docker-smoke-result.json"
          sbom="$PB12_RUN_DIR/pb12-image-sbom.cdx.json"
          scan="$PB12_RUN_DIR/pb12-trivy.json"
          if [[ ! -s "$result" ]]; then
            jq -n '{status:"FAIL",failureReason:"smoke result missing",dockerAvailable:true,imageBuilt:false,cleanupVerified:false}' > "$result"
          fi
          if [[ ! -s "$sbom" || ! -s "$scan" ]]; then
            jq '.status="FAIL" | .failureReason=((.failureReason // "") + "; SBOM or vulnerability scan missing")' "$result" > "$result.tmp"
            mv "$result.tmp" "$result"
            cp "$result" target/pb12-docker-smoke-result.json 2>/dev/null || true
            exit 1
          fi
          critical="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' "$scan")"
          high="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' "$scan")"
           jq --argjson critical "$critical" --argjson high "$high" \
             '.criticalVulnerabilities=$critical | .highVulnerabilities=$high |
              if $critical > 0 then .status="FAIL" | .failureReason=((.failureReason // "") + "; fixable CRITICAL vulnerabilities present") else . end' \
             "$result" > "$result.tmp"
           mv "$result.tmp" "$result"
           cp "$result" target/pb12-docker-smoke-result.json
           final_status="$(jq -r '.status // "FAIL"' "$result")"
           final_reason="$(jq -r '.failureReason // "unknown result failure"' "$result")"
           if [[ "$final_status" != PASS ]]; then
             echo "::error title=PB12 Docker result::$final_reason"
           fi
           if [[ "$critical" -gt 0 || "$high" -gt 0 ]]; then
             echo "::warning title=PB12 image vulnerability counts::critical=$critical high=$high"
             vuln_summary="$(jq -r '[.Results[]? | .Target as $target | .Vulnerabilities[]? | select(.Severity=="CRITICAL" or .Severity=="HIGH") | "\($target):\(.VulnerabilityID):\(.PkgName):\(.InstalledVersion)->\(.FixedVersion // "unfixed")"] | .[0:20] | join(" | ")' "$scan")"
             if [[ -n "$vuln_summary" ]]; then
               echo "::warning title=PB12 image vulnerability summary::$vuln_summary"
             fi
           fi
           jq '{status,failureReason,dockerAvailable,imageBuilt,imageId,imageSizeBytes,runtimeUser,runtimeUid,javaPid1,healthcheckHealthy,liveness,readiness,registered,login,me,careerCreated,careerRecovered,flywayMigrationsRun1,secondStartup,flywayMigrationsRun2,dockerStopUsed,dockerKillUsed,gracefulShutdownObserved,shutdownMarkerOrderValid,shutdownDurationMs,containerExitCode,redisDownReadiness,postgresDownReadiness,criticalVulnerabilities,highVulnerabilities,residualContainers,residualNetworks,cleanupVerified,authTempExists,authTempCleanupVerified,finalArtifactSecretScanPassed,secretLeaksDetected}' "$result"
           result_summary="$(jq -c '{status,failureReason,imageId,imageSizeBytes,runtimeUser,runtimeUid,javaPid1,healthcheckHealthy,liveness,readiness,registered,login,me,careerCreated,careerRecovered,flywayMigrationsRun1,secondStartup,flywayMigrationsRun2,dockerStopUsed,dockerKillUsed,gracefulShutdownObserved,shutdownMarkerOrderValid,shutdownDurationMs,containerExitCode,redisDownReadiness,postgresDownReadiness,criticalVulnerabilities,highVulnerabilities,residualContainers,residualNetworks,cleanupVerified,authTempExists,authTempCleanupVerified,finalArtifactSecretScanPassed,secretLeaksDetected}' "$result")"
           echo "::notice title=PB12 Docker result summary::$result_summary"
           [[ "$critical" -eq 0 ]]

      - name: Build and verify exact artifact manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result="$PB12_RUN_DIR/pb12-docker-smoke-result.json"
          artifact="$PB12_RUN_DIR/artifact"
          manifest="$artifact/pb12-artifact-manifest.json"
          scan_report="$artifact/pb12-secret-scan-report.json"
          verification="$PB12_RUN_DIR/pb12-artifact-verification.json"
          python tools/prepare-pb12-artifact.py --run-dir "$PB12_RUN_DIR" --artifact-dir "$artifact"
          python tools/build-pb12-artifact-manifest.py --artifact-dir "$artifact" --manifest "$manifest" --scan-report "$scan_report"
          python tools/verify-pb12-artifact-manifest.py --artifact-dir "$artifact" --manifest "$manifest" --scan-report "$scan_report" --verification-output "$verification"
          if [[ -s "$result" ]]; then
            jq --slurpfile verification "$verification" \
              '.artifactManifestVerified=$verification[0].artifactManifestVerified |
               .artifactInventoryExact=$verification[0].artifactInventoryExact |
               .artifactFilesUnscanned=$verification[0].artifactFilesUnscanned |
               .artifactFilesWithSecretMatches=$verification[0].artifactFilesWithSecretMatches |
               .manifestMetadataVerified=$verification[0].manifestMetadataVerified |
               .filesInventoried=$verification[0].filesInventoried |
               .filesScanned=$verification[0].filesScanned' \
              "$artifact/pb12-docker-smoke-result.json" > "$artifact/result.tmp"
            mv "$artifact/result.tmp" "$artifact/pb12-docker-smoke-result.json"
          fi
          python tools/build-pb12-artifact-manifest.py --artifact-dir "$artifact" --manifest "$manifest" --scan-report "$scan_report"
          python tools/verify-pb12-artifact-manifest.py --artifact-dir "$artifact" --manifest "$manifest" --scan-report "$scan_report" --verification-output "$verification"
          cp "$artifact/pb12-docker-smoke-result.json" target/pb12-docker-smoke-result.json
          jq '{artifactManifestVerified,artifactInventoryExact,artifactFilesUnscanned,artifactFilesWithSecretMatches,manifestMetadataVerified,filesInventoried,filesScanned}' "$verification"
          final_status="$(jq -r '.status // "FAIL"' "$artifact/pb12-docker-smoke-result.json")"
          [[ "$final_status" == PASS ]]

      - name: Publish exact artifact verification summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result="$PB12_RUN_DIR/artifact/pb12-docker-smoke-result.json"
          if [[ -s "$result" ]]; then
            summary="$(jq -c '{status,failureReason,artifactManifestVerified,artifactInventoryExact,artifactFilesUnscanned,artifactFilesWithSecretMatches,manifestMetadataVerified,filesInventoried,filesScanned,finalArtifactSecretScanPassed,secretLeaksDetected,criticalVulnerabilities,highVulnerabilities,cleanupVerified,authTempExists,authTempCleanupVerified}' "$result")"
            echo "::notice title=PB12 exact artifact verification::$summary"
          fi

      - name: Upload Docker smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pb12-docker-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/pb12-docker-smoke-${{ github.run_id }}/artifact/
          if-no-files-found: warn
          retention-days: 7
