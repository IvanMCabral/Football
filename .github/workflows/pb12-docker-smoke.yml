name: PB1.2.2 Docker smoke

on:
  workflow_dispatch:
  push:
    paths:
      - Dockerfile
      - .dockerignore
      - pom.xml
      - src/**
      - tools/**
      - .github/workflows/pb12-docker-smoke.yml

permissions:
  contents: read

concurrency:
  group: pb12-docker-smoke
  cancel-in-progress: true

jobs:
  docker-smoke:
    name: Build and smoke backend image
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout audited revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Generate ephemeral job credentials
        shell: bash
        run: |
          set -euo pipefail
          db_password="$(openssl rand -hex 32)"
          redis_password="$(openssl rand -hex 32)"
          jwt_secret="$(openssl rand -base64 96 | tr -d '\n')"
          echo "::add-mask::$db_password"
          echo "::add-mask::$redis_password"
          echo "::add-mask::$jwt_secret"
          {
            echo "DB_PASSWORD=$db_password"
            echo "REDIS_PASSWORD=$redis_password"
            echo "REDIS_USERNAME=default"
            echo "JWT_SECRET=$jwt_secret"
            echo "DB_NAME=football_manager"
            echo "DB_USER=manager"
            echo "PB12_RUN_DIR=$RUNNER_TEMP/pb12-docker-smoke-$GITHUB_RUN_ID"
            echo "PB12_HOST_PORT=18080"
            echo "PB12_RESTART_PORT=18081"
          } >> "$GITHUB_ENV"

      - name: Verify artifact hygiene fails closed
        shell: bash
        run: bash tools/test-pb12-artifact-hygiene.sh

      - name: Run real Docker build and lifecycle smoke
        id: smoke
        shell: bash
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          set -euo pipefail
          set +e
          bash tools/run-pb12-docker-smoke.sh
          smoke_exit=$?
          set -e
          result="$PB12_RUN_DIR/pb12-docker-smoke-result.json"
          if [[ -s "$result" ]]; then
            smoke_failure_reason="$(jq -r '.failureReason // "unknown smoke failure"' "$result")"
            echo "PB12 smoke result:"
            jq '{status,failureReason,dockerAvailable,imageBuilt,healthcheckHealthy,liveness,readiness,registered,login,me,careerCreated,careerRecovered,secondStartup,javaPid1,gracefulShutdownObserved,redisDownReadiness,postgresDownReadiness,cleanupVerified}' "$result"
            if [[ "$smoke_exit" -ne 0 ]]; then
              echo "::error title=PB12 Docker smoke failure::$smoke_failure_reason"
            fi
          else
            echo "::error title=PB12 Docker smoke failure::result JSON missing"
          fi
          if [[ "$smoke_exit" -ne 0 ]]; then exit "$smoke_exit"; fi
          mkdir -p target
          cp "$result" target/pb12-docker-smoke-result.json

      - name: Generate image SBOM
        if: always()
        uses: anchore/sbom-action@d94f46e13c6c62f59525ac9a1e147a99dc0b9bf5 # v0.17.0
        with:
          image: manager-backend:pb12
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/pb12-docker-smoke-${{ github.run_id }}/pb12-image-sbom.cdx.json
          upload-artifact: false

      - name: Scan image for vulnerabilities
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: manager-backend:pb12
          format: json
          output: ${{ runner.temp }}/pb12-docker-smoke-${{ github.run_id }}/pb12-trivy.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          vuln-type: os,library
          scanners: vuln

      - name: Finalize scan gate and result JSON
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result="$PB12_RUN_DIR/pb12-docker-smoke-result.json"
          sbom="$PB12_RUN_DIR/pb12-image-sbom.cdx.json"
          scan="$PB12_RUN_DIR/pb12-trivy.json"
          if [[ ! -s "$result" ]]; then
            jq -n '{status:"FAIL",failureReason:"smoke result missing",dockerAvailable:true,imageBuilt:false,cleanupVerified:false}' > "$result"
          fi
          if [[ ! -s "$sbom" || ! -s "$scan" ]]; then
            jq '.status="FAIL" | .failureReason=((.failureReason // "") + "; SBOM or vulnerability scan missing")' "$result" > "$result.tmp"
            mv "$result.tmp" "$result"
            cp "$result" target/pb12-docker-smoke-result.json 2>/dev/null || true
            exit 1
          fi
          critical="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' "$scan")"
          high="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' "$scan")"
           jq --argjson critical "$critical" --argjson high "$high" \
             '.criticalVulnerabilities=$critical | .highVulnerabilities=$high |
              if $critical > 0 then .status="FAIL" | .failureReason=((.failureReason // "") + "; fixable CRITICAL vulnerabilities present") else . end' \
             "$result" > "$result.tmp"
           mv "$result.tmp" "$result"
           cp "$result" target/pb12-docker-smoke-result.json
           final_status="$(jq -r '.status // "FAIL"' "$result")"
           final_reason="$(jq -r '.failureReason // "unknown result failure"' "$result")"
           if [[ "$final_status" != PASS ]]; then
             echo "::error title=PB12 Docker result::$final_reason"
           fi
           if [[ "$critical" -gt 0 || "$high" -gt 0 ]]; then
             echo "::warning title=PB12 image vulnerability counts::critical=$critical high=$high"
             vuln_summary="$(jq -r '[.Results[]? | .Target as $target | .Vulnerabilities[]? | select(.Severity=="CRITICAL" or .Severity=="HIGH") | "\($target):\(.VulnerabilityID):\(.PkgName):\(.InstalledVersion)->\(.FixedVersion // "unfixed")"] | .[0:20] | join(" | ")' "$scan")"
             if [[ -n "$vuln_summary" ]]; then
               echo "::warning title=PB12 image vulnerability summary::$vuln_summary"
             fi
           fi
           jq '{status,failureReason,dockerAvailable,imageBuilt,imageId,imageSizeBytes,runtimeUser,runtimeUid,javaPid1,healthcheckHealthy,liveness,readiness,registered,login,me,careerCreated,careerRecovered,flywayMigrationsRun1,secondStartup,flywayMigrationsRun2,dockerStopUsed,dockerKillUsed,gracefulShutdownObserved,shutdownMarkerOrderValid,shutdownDurationMs,containerExitCode,redisDownReadiness,postgresDownReadiness,criticalVulnerabilities,highVulnerabilities,residualContainers,residualNetworks,cleanupVerified}' "$result"
           result_summary="$(jq -c '{status,failureReason,imageId,imageSizeBytes,runtimeUser,runtimeUid,javaPid1,healthcheckHealthy,liveness,readiness,registered,login,me,careerCreated,careerRecovered,flywayMigrationsRun1,secondStartup,flywayMigrationsRun2,dockerStopUsed,dockerKillUsed,gracefulShutdownObserved,shutdownMarkerOrderValid,shutdownDurationMs,containerExitCode,redisDownReadiness,postgresDownReadiness,criticalVulnerabilities,highVulnerabilities,residualContainers,residualNetworks,cleanupVerified}' "$result")"
           echo "::notice title=PB12 Docker result summary::$result_summary"
           [[ "$critical" -eq 0 ]]

      - name: Final artifact secret scan and manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result="$PB12_RUN_DIR/pb12-docker-smoke-result.json"
          final_scan="$PB12_RUN_DIR/pb12-final-secret-scan.json"
          manifest="$PB12_RUN_DIR/pb12-artifact-manifest.json"
          mkdir -p "$PB12_RUN_DIR"
          leaks=0
          if find "$PB12_RUN_DIR" -type d -name auth-tmp -print -quit | grep -q .; then leaks=1; fi
          if grep -RIlE 'Authorization:[[:space:]]*Bearer[[:space:]]+[A-Za-z0-9._~-]{20,}|JWT_SECRET[=:][^[:space:]]+|REDIS_PASSWORD[=:][^[:space:]]+|DB_PASSWORD[=:][^[:space:]]+|postgres(ql)?://[^[:space:]]+:[^[:space:]]+@|redis://[^[:space:]]+:[^[:space:]]+@|(^|/)(\.env|.*\.cookie)$' "$PB12_RUN_DIR" target/pb12-docker-smoke-result.json --exclude='pb12-final-secret-scan.json' --exclude='pb12-artifact-manifest.json' >/dev/null 2>&1; then leaks=1; fi
          passed=true
          if [[ "$leaks" -ne 0 ]]; then passed=false; fi
          jq -n --argjson passed "$passed" --argjson leaks "$leaks" '{passed:$passed,secretLeaksDetected:$leaks,scope:"final uploaded artifact set",details:"match details intentionally withheld"}' > "$final_scan"
          if [[ -s "$result" ]]; then
            jq --argjson passed "$passed" --argjson leaks "$leaks" '.finalArtifactSecretScanPassed=$passed | .secretLeaksDetected=$leaks | if $passed then . else .status="FAIL" | .failureReason=((.failureReason // "") + "; final artifact secret scan failed") end' "$result" > "$result.tmp"
            mv "$result.tmp" "$result"
            cp "$result" target/pb12-docker-smoke-result.json
          fi
          python - "$PB12_RUN_DIR" "target/pb12-docker-smoke-result.json" <<'PY'
          import hashlib, json, pathlib, sys
          run_dir = pathlib.Path(sys.argv[1])
          target = pathlib.Path(sys.argv[2])
          files = []
          for path in sorted(run_dir.rglob('*')):
              if path.is_file() and path.name != 'pb12-artifact-manifest.json':
                  files.append(path)
          if target.is_file():
              files.append(target)
          entries = []
          for path in files:
              entries.append({
                  'path': path.as_posix(),
                  'sizeBytes': path.stat().st_size,
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  'type': path.suffix.lstrip('.') or 'text',
                  'containsSecrets': False,
              })
          (run_dir / 'pb12-artifact-manifest.json').write_text(
              json.dumps({'containsSecrets': False, 'files': entries}, indent=2) + '\n',
              encoding='utf-8')
          PY
          [[ "$leaks" -eq 0 ]]

      - name: Upload Docker smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pb12-docker-smoke-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pb12-docker-smoke-${{ github.run_id }}/
            target/pb12-docker-smoke-result.json
          if-no-files-found: warn
          retention-days: 7
