spring:
  config:
    activate:
      on-profile: prod
  r2dbc:
    pool:
      # Managed PostgreSQL providers can close idle TCP sessions before the
      # client-side pool notices. Evict and validate proactively so the first
      # public request after an idle window creates a fresh connection.
      max-idle-time: ${R2DBC_MAX_IDLE_TIME:2m}
      max-life-time: ${R2DBC_MAX_LIFE_TIME:10m}
      background-eviction-interval: ${R2DBC_BACKGROUND_EVICTION_INTERVAL:1m}
      max-acquire-time: ${R2DBC_MAX_ACQUIRE_TIME:10s}
      max-create-connection-time: ${R2DBC_MAX_CREATE_CONNECTION_TIME:10s}
      validation-depth: remote
      validation-query: SELECT 1
  flyway:
    baseline-on-migrate: false
  data:
    redis:
      ssl:
        enabled: ${REDIS_SSL:true}

server:
  error:
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.footballmanager: ${LOG_LEVEL_APP:INFO}
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.springframework.r2dbc: WARN
    org.springframework.data.redis: WARN
    io.r2dbc.postgresql: WARN

app:
  simulation:
    detailed:
      mutate-career-state: false
      persist-injuries: false
      persist-fatigue: false
      persist-discipline: false
      persist-form: false
      persist-detail: true
      expose-detail-api: true
  production:
    admin-endpoints-enabled: false
    seed-endpoints-enabled: false
    debug-endpoints-enabled: false
