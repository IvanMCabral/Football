# Local QA profile - player season stats API enablement
# Activate with: mvn spring-boot:run -Dspring-boot.run.profiles=local
# Or: java -jar ... --spring.profiles.active=local
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:football_manager}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:football_manager}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:football_manager}
    user: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
jwt:
  secret: ${JWT_SECRET}

app:
  security:
    rate-limit:
      enabled: false
  simulation:
    league:
      use-classic-engine: false
      detailed-enabled: true
    detailed:
      expose-detail-api: true         # Enable stats/player-season API
      persist-detail: true              # Persist detailed match data to Redis after simulation
      mutate-career-state: false       # Read-only - do NOT mutate career state
      persist-injuries: false
      persist-fatigue: false
      persist-discipline: false
      persist-form: false
  security:
    cors:
      allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
