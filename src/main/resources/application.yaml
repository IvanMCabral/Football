spring:
  application:
    name: football-manager
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  
  # R2DBC (Reactive Database Connection)
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=${DB_SSL_MODE:disable}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    pool:
      initial-size: 5
      max-size: 20
      max-idle-time: 30m
      validation-query: SELECT 1

  # Flyway (Database Migrations) - uses JDBC
  flyway:
    enabled: true
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    user: ${DB_USER}
    password: ${DB_PASSWORD}
    locations: classpath:db/migration
    baseline-on-migrate: false
  
  # Redis (Career runtime storage)
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL:false}
      timeout: 30000ms  # Aumentado a 30s para CareerSave grande
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: -1ms
        shutdown-timeout: 100ms

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

# Server Configuration
server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${PORT:${SERVER_PORT:8080}}
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
  # Force UTF-8 on every response so the frontend never has to guess encoding.
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true

# Actuator (Health checks and metrics)
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized

# Logging
logging:
  level:
    root: INFO
    com.footballmanager: INFO
    org.springframework.r2dbc: WARN
    org.springframework.data.r2dbc: WARN
    io.r2dbc.postgresql: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Application-specific settings
app:
  name: Football Manager
  version: 1.0.0
  description: Turn-based football team management and match simulation system
  redis:
    world-ttl: ${REDIS_WORLD_TTL:30d}
    match-detail-ttl: ${REDIS_MATCH_DETAIL_TTL:30d}
    lifecycle-coordination-timeout: ${REDIS_LIFECYCLE_COORDINATION_TIMEOUT:30s}
    lifecycle-mode: ${APP_REDIS_LIFECYCLE_MODE:single-instance}
  world:
    import:
      three-league: ${APP_WORLD_IMPORT_THREE_LEAGUE:false}
  simulation:
    league:
      use-classic-engine: false
      detailed-enabled: true
    detailed:
      mutate-career-state: false
      persist-injuries: false
      persist-fatigue: false
      persist-discipline: false
      persist-form: false
      persist-detail: true
      expose-detail-api: true
  security:
    cors:
      allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
    rate-limit:
      enabled: ${APP_RATE_LIMIT_ENABLED:true}
      auth:
        max-requests: ${APP_AUTH_RATE_LIMIT_MAX_REQUESTS:20}
        window: ${APP_AUTH_RATE_LIMIT_WINDOW:PT1M}
    production:
      required-variables: DB_HOST,DB_PORT,DB_NAME,DB_USER,DB_PASSWORD,REDIS_HOST,REDIS_PORT,REDIS_PASSWORD,JWT_SECRET,APP_CORS_ALLOWED_ORIGINS
