# Test profile.
# Activated with: @ActiveProfiles("test")
#
# This profile is ISOLATED from the running dev backend:
#   - DB: ephemeral PostgreSQL process managed by test bootstrap
#   - Redis: ephemeral Redis process managed by test bootstrap, logical database 15
#   - Flyway: enabled against the ephemeral PostgreSQL database
#   - Server: RANDOM_PORT (assigned by Spring TestContext, never clashes with :8080)
#
# DO NOT use this profile for the running dev backend.
# DO NOT modify application.yaml / application-local.yml / application-career-mutations.yml
# to support this profile - keep test concerns in this file only.

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME_TEST:postgres}
    username: ${DB_USER:manager_test}
    password: ${DB_PASSWORD:}

  # Reuse the dev DB credentials, point at the TEST database
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME_TEST:postgres}
    username: ${DB_USER:manager_test}
    password: ${DB_PASSWORD:}
    pool:
      initial-size: 2
      max-size: 5
      max-idle-time: 5m
      validation-query: SELECT 1

  flyway:
    enabled: true

  # Use Redis database 15 so the dev backend (DB 0) and tests don't collide.
  # The ReactiveRedisConnectionFactory is auto-configured from these properties.
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:test-profile-overridden-by-redis-bootstrap}
      ssl:
        enabled: false
      database: 15
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 5
          max-idle: 3
          min-idle: 1
          max-wait: -1ms
        shutdown-timeout: 100ms

  # Test-side JPA / SQL init: leave alone
  jpa:
    defer-datasource-initialization: false

# Use the detailed engine in tests so behaviour matches local development.
app:
  security:
    rate-limit:
      enabled: false
  simulation:
    league:
      use-classic-engine: false
      detailed-enabled: true
    detailed:
      mutate-career-state: false
      persist-injuries: false
      persist-fatigue: false
      persist-discipline: false
      persist-form: false
      persist-detail: true
      expose-detail-api: true

manager:
  redis:
    auto-reconnect: false

jwt:
  secret: test-profile-synthetic-jwt-secret-64-bytes-minimum-000000000000000000
  expiration: 86400000
  refresh-expiration: 604800000

# Quieter logging during tests - keep R2DBC/Redis noise low
logging:
  level:
    root: WARN
    com.footballmanager: INFO
    org.springframework.r2dbc: WARN
    org.springframework.data.r2dbc: WARN
    org.springframework.data.redis: WARN
    io.r2dbc.postgresql: WARN
    org.flywaydb: ERROR
